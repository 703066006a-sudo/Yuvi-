function render(){const m=markets[market],date=rows[selected].date,events=getEvents();document.getElementById('symbol').textContent=m.symbol;document.getElementById('market-title').textContent=m.name;document.getElementById('period').textContent=m.start+'—'+m.end+' · 历史导航范围';document.getElementById('month-title').textContent='关键时刻';document.getElementById('event-count').textContent=events.length+' / '+eventData[market].length+' 个节点';document.getElementById('events').innerHTML=events.length?events.map((e,i)=>`<button class="event ${chosen===i?'selected':''}" data-event="${i}"><span class="event-date">${e.month.slice(0,4)}<br>${e.month.slice(5)}${e.day==='—'?'':'.'+e.day}</span><span><span class="event-name">${e.title}</span><div class="event-kind">${e.type} · ${e.tag==='待核实条目'?'待核实':'已有来源摘要'}</div></span></button>`).join(''):'<div class="empty">这个市场的大事件档案正在补齐。<br>当前预览尚未录入相关节点。</div>';document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.event);selected=rows.findIndex(r=>r.date===events[chosen].month);tab='mechanism';render()});renderDetail(events[chosen]);draw()}

function enrichNodes(e){
 const box=document.getElementById('details'),known=nodeDetails[market+':'+e.month];
 box.querySelectorAll('.story-intro,.story-step,.story-result,.story-risks').forEach((node,i)=>{
 const d=document.createElement('details');d.className=node.className+' explorable';
 const summary=document.createElement('summary');summary.innerHTML=node.innerHTML+'<span class="expand-hint">展开细节 ＋</span>';d.appendChild(summary);
 const extra=known?.[i];const panel=document.createElement('div');panel.className='node-extra';
 panel.innerHTML=extra?'<h5>'+esc(extra[0])+'</h5><p>'+esc(extra[1])+'</p><h5>哪些地方不能直接下结论？</h5><p>'+esc(extra[2])+'</p>':'<h5>目前掌握了什么？</h5><p>'+esc(humanText(e.copy))+'</p><h5>这一环还缺什么？</h5><p>要进一步说明这一步，需要找到发生时间、涉及的人或机构、他们采取的动作，以及动作之后的价格或资金变化。目前没有足够的节点级证据，不把事件整体摘要当作这一环已经成立的证明。</p><h5>怎样检查？</h5><p>'+esc(humanText(e.limit))+'</p>';
 panel.innerHTML+='<a class="source" href="'+sources[e.source].url+'" target="_blank" rel="noopener">查看原始资料 ↗</a>';d.appendChild(panel);node.replaceWith(d);
 d.addEventListener('toggle',()=>{summary.querySelector('.expand-hint').textContent=d.open?'收起细节 −':'展开细节 ＋'});
 });
}
function humanText(t){return t.replace(/流动性/g,'市场里能接住卖盘的钱').replace(/卖压/g,'卖出股票的人带来的压力').replace(/风险溢价/g,'投资者要求的额外回报').replace(/信用收缩/g,'借钱变得更难').replace(/杠杆/g,'借钱投资').replace(/传导/g,'影响');}
function renderDetail(e){
 const box=document.getElementById('details');if(!e){box.innerHTML='<p class="detail-copy">没有找到事件，换个关键词试试。</p>';return}
 const pending=e.tag==='待核实条目',hidden=replay&&e.available>rows[selected].date;
 const story=plainCases[market+':'+e.month];
 let body='';
 if(hidden)body='<p class="detail-copy">回到当时后，暂时隐藏后来才知道的解释。</p>';
 else if(pending)body='<div class="story-intro"><h4>这件事为什么发生？</h4><p>还没有查清，暂时不把猜测写成原因。</p></div><p class="detail-copy">'+esc(humanText(e.copy))+'</p>';
 else if(story)body=`<div class="story-intro"><h4>先看前因</h4><p>${story.before}</p></div><div class="story-flow">${story.steps.map((v,i)=>`<div class="story-step"><span class="step-number">${i+1}</span><div><h4>${v[0]}</h4><p>${v[1]}</p></div></div><div class="story-down">↓</div>`).join('')}<div class="story-result"><h4>最后出现了什么结果？</h4><p>${story.result}</p></div></div><div class="story-risks"><h4>还要担心什么？</h4>${story.risks.map(r=>'<p>• '+r+'</p>').join('')}<span class="small-label">这些是需要留意的问题，不是说一定会发生。</span></div>`;
 else body=`<div class="story-intro"><h4>这件事发生了什么？</h4><p>${esc(humanText(e.copy))}</p></div><div class="story-flow">${e.chain.map((t,i)=>`<div class="story-step"><span class="step-number">${i+1}</span><div><p>${esc(humanText(t))}</p></div></div>${i<e.chain.length-1?'<div class="story-down">↓</div>':''}`).join('')}</div><p class="small-label">这是目前资料提到的影响顺序。每一步为什么接着发生，还需要补齐证据。</p><div class="story-risks"><h4>后来还留下了什么问题？</h4><p>这一项还没有完成研究，暂时没有可靠结论。</p></div>`;
 box.innerHTML=`<div class="case-heading"><div><div class="small-label">${e.month}${e.day==='—'?'':'.'+e.day}</div><h3>${e.title}</h3></div><span class="tag">${pending?'原因还在查':'已有资料 · 解释仍需核实'}</span></div>`+body+(hidden?'':`<details class="evidence-fold"><summary>查看依据，以及哪些地方还不能确定</summary><p class="detail-copy">${esc(humanText(e.limit))}</p><a class="source" href="${sources[e.source].url}" target="_blank" rel="noopener">${sources[e.source].name} ↗</a><p class="small-label">箭头表示可能的影响顺序，不代表每一步都已证明。</p></details>`);enrichNodes(e);
}
document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{market=b.dataset.market;document.getElementById('search').value='';populateEras();rows=makeRows(markets[market]);selected=Math.max(0,rows.findIndex(r=>r.date===markets[market].focus));chosen=Math.max(0,getEvents().findIndex(e=>e.month===markets[market].focus));tab='mechanism';document.querySelectorAll('[data-market]').forEach(x=>x.classList.toggle('active',x===b));render()});function jumpEvent(delta){const events=getEvents();chosen=Math.max(0,Math.min(events.length-1,chosen+delta));if(events[chosen]){selected=rows.findIndex(r=>r.date===events[chosen].month);tab='mechanism';render()}}function populateEras(){const decades=[...new Set(eventData[market].map(e=>e.month.slice(0,3)))];document.getElementById('era').innerHTML='<option value="">全部年代</option>'+decades.map(d=>'<option value="'+d+'">'+d+'0 年代</option>').join('')}function filterEvents(){chosen=0;const e=getEvents()[0];if(e)selected=rows.findIndex(r=>r.date===e.month);tab='mechanism';render()}document.getElementById('search').oninput=filterEvents;document.getElementById('era').onchange=filterEvents;populateEras();rows=makeRows(markets.us);selected=rows.findIndex(r=>r.date===markets.us.focus);chosen=getEvents().findIndex(e=>e.month===markets.us.focus);render();
